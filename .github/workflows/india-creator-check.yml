name: India creator check

# Scores everyone in the "India not in DB" tab on how much of a creator they are (lifetime posts,
# posting pace, reactions and comments on their posts) and keeps the result in the
# "India Creator Scores" tab, best first. See v2/creators.py.
#
# Each run opens up to 1,200 post pages (~30 minutes). New people are checked first, then people
# whose page failed to load, then anyone last checked over 7 days ago. While people are still
# due, each run queues the next one straight away; the 3-hourly cron restarts the chain if it
# stops and picks up weekly rechecks once everyone has been scored.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Post pages to open this run"
        default: "1200"
      dry_run:
        description: "Dry run: check and print, write nothing to the sheet"
        type: boolean
        default: false
      chained:
        description: "Queue another run when this one finishes, while people are still due"
        type: boolean
        default: true
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: india-creator-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets a run queue the next one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PYTHONUNBUFFERED: "1"
      MAX_CONSECUTIVE_BLOCKS: "3"
      MARKET_NAME: India
      MARKET_SUBDOMAIN: in
      V2_BULK_TAB: India Bulk
      V2_QUALIFIED_TAB: India Qualified
      CREATOR_SOURCE_TAB: India not in DB
      CREATOR_SCORE_TAB: India Creator Scores
      CREATOR_MAX_MINUTES: "90"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check creators
        id: check
        run: >
          python -m v2.creators
          --limit "${{ inputs.limit || '1200' }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Queue the next run while people are still due
        if: >-
          ${{ !inputs.dry_run && (github.event_name == 'schedule' || inputs.chained)
          && steps.check.outputs.left != '0' && steps.check.outputs.blocked != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run india-creator-check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f chained=true -f limit="${{ inputs.limit || '1200' }}"
