name: Creator pipeline (bulk add + verify)

# Runs every hour as a chain: each run does its work, waits until an hour has passed since it
# started, then queues the next run. GitHub's own scheduler drops most hourly runs, so the cron
# below is only a backup that restarts the chain if it ever breaks. Scheduled and chained runs
# skip the bulk add if creators were added in the last 30 minutes, so nothing doubles up.

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "How many creators to add to the Bulk tab"
        default: "100"
      dry_run:
        description: "Dry run: crawl and print results, don't touch the sheet"
        type: boolean
        default: false
      chained:
        description: "Keep going every hour after this run (leave ticked to (re)start the hourly chain)"
        type: boolean
        default: true

# Never let two runs write to the sheet at the same time.
concurrency:
  group: creator-sheet
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets a run queue the next one

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PYTHONUNBUFFERED: "1"
      CHAIN: ${{ github.event_name == 'schedule' || inputs.chained }}
    steps:
      - run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dry run (no sheet)
        if: ${{ inputs.dry_run }}
        run: python bulk_add.py --no-sheet --target "${{ inputs.target || '10' }}" --max-pages 60

      - name: Bulk add creators
        if: ${{ !inputs.dry_run }}
        run: >
          python bulk_add.py --target "${{ inputs.target || '100' }}"
          ${{ env.CHAIN == 'true' && '--min-gap-minutes 30' || '' }}

      - name: Verify creators
        # Runs even if bulk add hit a problem, so already-added rows still get verified.
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: python verify.py

      - name: Recheck a batch of qualified creators
        # 150 per hour covers ~3,600 a day, least recently checked first.
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: python recheck.py --limit 150

      - name: Queue the next hourly run
        if: ${{ !cancelled() && !inputs.dry_run && env.CHAIN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 3600 - ($(date +%s) - STARTED_AT) ))
          if [ "$wait" -gt 0 ]; then echo "next run in ${wait}s"; sleep "$wait"; fi
          gh workflow run creator-pipeline.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f target="${{ inputs.target || '100' }}" -f chained=true
