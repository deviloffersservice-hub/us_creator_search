name: India creator emails

# Finds the public collab email of the Strong, then Possible, creators in "India Creator Scores"
# (from search-engine snippets of their own LinkedIn page) and keeps them in "India Creator
# Emails". Three fixed parts of the list are searched side by side (separate machines, so the
# search engines see three different addresses); then one step sorts the tab and queues the next
# run, until the target number of emails is reached or everyone has been searched.
# See v2/emails.py.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Stop once this many emails are found"
        default: "5000"  # i.e. as many as the free search can find
      limit:
        description: "People to search per part per run"
        default: "600"
      dry_run:
        description: "Dry run: search and print, write nothing to the sheet"
        type: boolean
        default: false
      chained:
        description: "Queue another run when this one finishes, until the target is reached"
        type: boolean
        default: true
  schedule:
    - cron: "41 */3 * * *"  # restarts the chain if it stopped (e.g. a part was throttled)

concurrency:
  group: india-creator-emails
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets a run queue the next one

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  PYTHONUNBUFFERED: "1"
  MARKET_NAME: India
  MARKET_SUBDOMAIN: in
  CREATOR_SCORE_TAB: India Creator Scores
  CREATOR_EMAIL_TAB: India Creator Emails

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find emails (part ${{ matrix.shard }})
        run: >
          python -m v2.emails --shard "${{ matrix.shard }}" --verbose
          --target "${{ inputs.target || '5000' }}"
          --limit "${{ inputs.limit || '600' }}"
          --minutes 90
          ${{ inputs.dry_run && '--dry-run' || '' }}

  finish:
    needs: search
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sort the tab and count
        id: finish
        run: python -m v2.emails --finish --target "${{ inputs.target || '5000' }}"
      - name: Queue the next run until the target is reached
        # A part that failed (all search engines refusing us) stops the chain instead of looping.
        if: ${{ (github.event_name == 'schedule' || inputs.chained) && needs.search.result == 'success' && steps.finish.outputs.left != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run india-creator-emails.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f chained=true -f target="${{ inputs.target || '5000' }}" -f limit="${{ inputs.limit || '600' }}"
