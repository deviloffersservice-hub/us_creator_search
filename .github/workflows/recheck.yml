name: Daily recheck of qualified creators

on:
  schedule:
    # Twice a day (06:00 and 18:00 IST): GitHub sometimes drops scheduled runs, and a second
    # pass simply rechecks the next least-recently-checked creators.
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

# Separate lane from the hourly pipeline: they write different cells, so both can run at once.
concurrency:
  group: creator-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python recheck.py
