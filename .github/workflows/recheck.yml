name: Daily recheck of qualified creators

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST (00:30 UTC)
  workflow_dispatch:

# Separate lane from the hourly pipeline: they write different cells, so both can run at once.
concurrency:
  group: creator-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python recheck.py
